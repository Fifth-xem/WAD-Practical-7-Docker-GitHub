
services:
  app:
    build: .
    container_name: wad-practical7-app
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/studentDB
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8
    container_name: wad-practical7-mongo
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mongodb_data:
